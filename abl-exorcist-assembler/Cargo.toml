[package]
name = "abl-exorcist-assembler"
version = "0.0.1"
edition = "2024"
license.workspace = true
rust-version = "1.85"
description = "Assemble mainline kernels and initrds for abl-exorcist Android boot payloads"
repository = "https://github.com/samcday/abl-exorcist"
homepage = "https://github.com/samcday/abl-exorcist"
documentation = "https://docs.rs/abl-exorcist-assembler"
readme = "README.md"
keywords = ["android", "boot", "kernel", "aarch64"]
categories = ["command-line-utilities", "embedded"]

[features]
default = ["std"]
std = ["dep:flate2", "dep:lzzzz", "dep:zstd"]

[dependencies]
flate2 = { version = "1.1", optional = true }
lzzzz = { version = "2.0", optional = true }
zstd = { version = "0.13", optional = true }
