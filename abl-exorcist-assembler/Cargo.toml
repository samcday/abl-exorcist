[package]
name = "abl-exorcist-assembler"
version = "0.0.1"
edition = "2024"
license.workspace = true
publish = false

[[bin]]
name = "abl-exorcist-assembler"
path = "src/main.rs"
required-features = ["std"]

[features]
default = ["std"]
std = ["dep:flate2", "dep:zstd"]

[dependencies]
flate2 = { version = "1.1", optional = true }
lz4_flex = { version = "0.12.2", default-features = false, features = ["safe-encode", "safe-decode"] }
zstd = { version = "0.13", optional = true }
