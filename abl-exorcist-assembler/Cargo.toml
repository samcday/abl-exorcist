[package]
name = "abl-exorcist-assembler"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[[bin]]
name = "abl-exorcist-assembler"
path = "src/main.rs"
required-features = ["std"]

[features]
default = ["std"]
std = ["dep:abootimg-oxide", "dep:flate2", "dep:lzzzz", "dep:sha1", "dep:zstd"]

[dependencies]
flate2 = { version = "1.1", optional = true }
lzzzz = { version = "2.0", optional = true }
# samcday fork until the dtb_position fix and the repack accessors land upstream.
abootimg-oxide = { git = "https://github.com/samcday/abootimg-oxide", rev = "39543c29358c8b0d0533a85a42ed6b0a147417ed", optional = true, features = ["hash"] }
sha1 = { version = "0.11", optional = true }
zstd = { version = "0.13", optional = true }
