name: Release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    if: github.repository == 'samcday/abl-exorcist'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: stable
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5  # v0.5
        with:
          command: release
          version: 0.3.169
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-pr:
    name: Prepare release PR
    if: github.repository == 'samcday/abl-exorcist'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Serialize PR updates; publishing must not cancel pending release runs.
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: stable
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5  # v0.5
        with:
          command: release-pr
          version: 0.3.169
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
